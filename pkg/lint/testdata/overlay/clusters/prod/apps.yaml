---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps
  targetNamespace: overlay-ns
  nameSuffix: -green
  patches:
    - target:
        kind: ConfigMap
        name: settings
      patch: |
        - op: replace
          path: /data/value
          value: patched
