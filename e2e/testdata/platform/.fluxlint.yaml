kubeVersion: "1.31.0"
entrypoints:
  - clusters/production
externals:
  # cluster-api-operator installs CAPA's CRDs when it reconciles the
  # InfrastructureProvider: nothing in Git renders them, but anything using
  # them must still come after the providers Kustomization.
  runtimeCRDs:
    - group: infrastructure.cluster.x-k8s.io
      providedBy: flux-system/infra-capi-providers
