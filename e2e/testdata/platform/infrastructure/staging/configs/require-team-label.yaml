apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-team-label
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-team
      match:
        any:
          - resources:
              kinds: [Namespace]
      validate:
        message: "namespaces need a team label"
        pattern:
          metadata:
            labels:
              team: "?*"
