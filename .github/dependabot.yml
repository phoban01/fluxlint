version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      kubernetes: {patterns: ["k8s.io/*", "sigs.k8s.io/*"]}
      flux: {patterns: ["github.com/fluxcd/*"]}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: gomod
    directory: /contract
    schedule: {interval: monthly}
    # the library keeps its minimum versions low so operators are not forced to upgrade
    open-pull-requests-limit: 0
