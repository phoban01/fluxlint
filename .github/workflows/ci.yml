name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test

  # Runs the built binary against e2e/testdata/platform: real cert-manager,
  # kyverno, cluster-api-operator and podinfo, fetched at pinned versions.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .fluxlint-cache/e2e
          key: e2e-sources-${{ hashFiles('e2e/testdata/**') }}
          restore-keys: e2e-sources-
      - run: make e2e
