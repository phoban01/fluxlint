name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - name: go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      - name: install.sh
        run: shellcheck install.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # FL-V007 is Kyverno's own verdict, so its test needs Kyverno's CLI
      - name: kyverno CLI
        env:
          KYVERNO_VERSION: v1.19.1
          KYVERNO_SHA256: b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae
        run: |
          curl -sSfL -o kyverno.tar.gz "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          echo "${KYVERNO_SHA256}  kyverno.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf kyverno.tar.gz -C "$HOME/.local/bin" kyverno
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm kyverno.tar.gz
      - name: the kyverno test must run, not skip
        run: |
          go test ./pkg/lint/ -run TestKyvernoPolicies -v | tee /dev/stderr | grep -q -e "--- PASS: TestKyvernoPolicies"
      - run: make test
      - name: contract module
        run: cd contract && go vet ./... && go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # every release target, without publishing anything
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - run: ./dist/fluxlint_linux_amd64_v1/fluxlint version

  # Runs the built binary against e2e/testdata/platform: real cert-manager,
  # kyverno, cluster-api-operator and podinfo, fetched at pinned versions.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: .fluxlint-cache/e2e
          key: e2e-sources-${{ hashFiles('e2e/testdata/**') }}
          restore-keys: e2e-sources-
      - run: make e2e
